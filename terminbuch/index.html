<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Friseur Terminbuch Demo – Pilotwerk Digital</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<style>
@font-face{font-family:"Inter";src:url("/assets/fonts/inter-400.woff") format("woff");font-weight:400;font-display:swap}
@font-face{font-family:"Inter";src:url("/assets/fonts/inter-600.woff") format("woff");font-weight:500 600;font-display:swap}
@font-face{font-family:"Inter";src:url("/assets/fonts/inter-700.woff") format("woff");font-weight:700 800;font-display:swap}
@font-face{font-family:"Inter Display";src:url("/assets/fonts/interdisplay-700.woff") format("woff");font-weight:700;font-display:swap}
/* Layout: hair salon "week + agenda". Dark sticky header with salon name and a 7-day strip (closed days dimmed) -> day totals -> staff filter chips -> two big actions (new appointment, walk-in) -> one vertical agenda per day, with free gaps shown when one person is selected -> bottom sheets: 3-step booking wizard (service -> free times -> customer), appointment details, price list. Single light theme by design. */
:root{
  --bg:#F2F2F4; --card:#FFFFFF; --ink:#1D1D1F; --muted:#6E6E73; --line:#E3E3E8;
  --head:#1D1D1F; --head-ink:#F5F5F7; --head-muted:#A1A1A6;
  --accent:#FF6A13; --link:#B8430A;
  --ok:#1E7B3A; --ok-soft:#E8F5EC; --warn:#8F5000; --warn-soft:#FFF4E5; --bad:#C0362C; --bad-soft:#FDECEA;
  --font:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --display:"Inter Display","Inter",ui-sans-serif,system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15.5px/1.45 var(--font);-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
button{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.demo-bar{background:#FFF1E8;color:#1D1D1F;font:600 13.5px/1.3 var(--font);text-align:center;padding:7px max(16px,env(safe-area-inset-left,0px));padding-top:calc(7px + env(safe-area-inset-top,0px))}
.demo-bar a{color:#B8430A;font-weight:700}
.demo-bar a[aria-current="page"]{text-decoration:none;border-radius:999px;padding:1px 8px;background:rgba(0,0,0,.08)}
.col{max-width:680px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Header */
.top{position:sticky;top:0;z-index:5;background:var(--head);color:var(--head-ink);padding:14px 0 12px}
.brandrow{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand b{display:block;font-family:var(--display);font-size:24px;letter-spacing:-.02em;line-height:1.1}
.brand span{font-size:13px;color:var(--head-muted)}
.hbtn{border:0;background:rgba(255,255,255,.12);color:var(--head-ink);border-radius:999px;padding:8px 14px;min-height:40px;font-weight:600;font-size:14px;cursor:pointer}
.weeknav{display:flex;align-items:center;gap:8px;margin:14px 0 10px}
.weeknav b{flex:1;font-size:15px}
.arrow{width:40px;height:40px;border-radius:50%;border:0;background:rgba(255,255,255,.12);color:var(--head-ink);display:grid;place-items:center;cursor:pointer;flex:none}
.arrow svg{width:18px;height:18px}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.day{border:0;border-radius:14px;background:rgba(255,255,255,.07);color:var(--head-ink);padding:7px 0 6px;display:flex;flex-direction:column;align-items:center;gap:1px;cursor:pointer;min-height:64px}
.day small{font-size:12px;color:var(--head-muted)}
.day b{font-size:18px;font-variant-numeric:tabular-nums;line-height:1.2}
.day i{font-style:normal;font-size:11px;color:var(--head-muted);min-height:14px}
.day.today b{color:var(--accent)}
.day.closed{opacity:.5}
.day[aria-pressed="true"]{background:var(--accent);color:#1D1D1F;opacity:1}
.day[aria-pressed="true"] small,.day[aria-pressed="true"] i,.day[aria-pressed="true"].today b{color:#1D1D1F}

/* Body */
main .col{padding-block:16px 48px;display:flex;flex-direction:column;gap:14px}
.note{background:#FFF1E8;border-radius:14px;padding:12px 14px;font-size:14px;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between}
.note button{border:0;background:#FFFFFF;border-radius:999px;padding:6px 12px;min-height:36px;font-weight:600;font-size:13.5px;cursor:pointer}
.sum{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.sum div{background:var(--card);border-radius:16px;padding:12px 14px;min-width:0}
.sum b{display:block;font-family:var(--display);font-size:22px;font-variant-numeric:tabular-nums;line-height:1.15;white-space:nowrap}
.sum span{font-size:12.5px;color:var(--muted)}
.staff{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-inline:-4px;padding:2px 4px}
.staff::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 14px 5px 5px;min-height:44px;cursor:pointer;font-weight:600;font-size:14.5px}
.chip.all{padding-left:16px}
.chip em{font-style:normal;font-weight:500;color:var(--muted);font-size:13px}
.chip[aria-pressed="true"]{background:var(--ink);color:#FFFFFF;border-color:var(--ink)}
.chip[aria-pressed="true"] em{color:#C7C7CC}
.av{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:#FFFFFF;font-size:13px;font-weight:700;flex:none}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:14px;min-height:50px;padding:10px 14px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#1D1D1F}
.btn.dark{background:var(--ink);border-color:var(--ink);color:#FFFFFF}
.btn.wa{background:var(--ok-soft);border-color:var(--ok-soft);color:var(--ok)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn svg{width:18px;height:18px;flex:none}
.banner{background:var(--card);border-radius:14px;padding:12px 14px;font-size:14.5px;display:flex;gap:10px;align-items:center}
.banner svg{width:20px;height:20px;color:var(--link);flex:none}
.banner b{color:var(--link)}
.agenda{display:flex;flex-direction:column;gap:8px}
.row{display:grid;grid-template-columns:52px minmax(0,1fr);gap:10px}
.tm{padding-top:13px;text-align:right;font-variant-numeric:tabular-nums}
.tm b{display:block;font-size:15px;line-height:1.2}
.tm small{color:var(--muted);font-size:12px}
.appt{position:relative;width:100%;text-align:left;border:0;background:var(--card);border-radius:16px;padding:12px 14px 12px 19px;cursor:pointer;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 10px;overflow:hidden}
.appt::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--c)}
.appt .nm{font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.appt .sv{grid-column:1;color:var(--muted);font-size:14px;display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;min-width:0}
.appt .sv .av{width:22px;height:22px;font-size:11px}
.appt .pr{grid-row:1;grid-column:2;font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
.appt .st{grid-row:2;grid-column:2;justify-self:end;align-self:start}
.appt.cancelled,.appt.noshow{opacity:.6}
.appt.cancelled .nm,.appt.noshow .nm{text-decoration:line-through}
.pill{display:inline-block;font-size:12px;font-weight:600;border-radius:999px;padding:2px 8px;white-space:nowrap}
.pill.done{background:var(--ok-soft);color:var(--ok)}
.pill.noshow{background:var(--warn-soft);color:var(--warn)}
.pill.cancelled{background:var(--bad-soft);color:var(--bad)}
.pill.tag{background:#F2F2F4;color:var(--ink)}
.pill.hot{background:#FFF1E8;color:var(--link)}
.gap{width:100%;border:1.5px dashed #C7C7CC;background:transparent;border-radius:16px;padding:12px 14px;text-align:left;color:var(--muted);cursor:pointer;font-size:14.5px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.gap b{color:var(--ink)}
.gap span:last-child{color:var(--link);font-weight:600;white-space:nowrap}
.nowline{display:flex;align-items:center;gap:8px;color:var(--bad);font-size:12.5px;font-weight:700;margin-left:4px}
.nowline::after{content:"";flex:1;height:2px;background:var(--bad);border-radius:2px}
.empty{background:var(--card);border-radius:16px;padding:22px;text-align:center;color:var(--muted)}
.foot{text-align:center;font-size:13px;color:var(--muted)}
.foot button{border:0;background:none;color:var(--link);font-weight:600;cursor:pointer;min-height:44px;padding:0 8px}

/* Sheets */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:min(560px,100%);max-height:92%;overflow:auto;border-radius:22px 22px 0 0;padding:18px max(16px,env(safe-area-inset-left,0px)) calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.sheet:focus{outline:none}
@media (min-width:700px){.ov{align-items:center}.sheet{border-radius:22px;padding:22px 24px}}
.sh{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sh h2{margin:0;font-family:var(--display);font-size:22px;letter-spacing:-.01em;line-height:1.2}
.sh p{margin:2px 0 0;color:var(--muted);font-size:14px}
.x{width:40px;height:40px;border-radius:50%;border:0;background:var(--card);cursor:pointer;display:grid;place-items:center;flex:none}
.x svg{width:18px;height:18px}
.steps{display:flex;gap:6px}
.steps span{flex:1;height:4px;border-radius:4px;background:var(--line)}
.steps span.on{background:var(--accent)}
.lbl{font-size:13px;font-weight:600;color:var(--muted);margin:0 0 6px}
.svcgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.svc{position:relative;border:1px solid var(--line);background:var(--card);border-radius:16px;padding:12px 30px 12px 12px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-height:74px}
.svc b{font-size:15px;line-height:1.25}
.svc span{font-size:13px;color:var(--muted)}
.svc i{position:absolute;right:12px;top:14px;width:10px;height:10px;border-radius:50%;background:var(--c)}
.svc[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.mini{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 12px;min-height:42px;cursor:pointer;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.mini .av{width:26px;height:26px;font-size:11px;margin-left:-6px}
.mini[aria-pressed="true"]{background:var(--ink);color:#FFFFFF;border-color:var(--ink)}
.stepper{display:flex;align-items:center;gap:6px}
.stepper output{min-width:76px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:6px}
.slot{border:1px solid var(--line);background:var(--card);border-radius:12px;min-height:44px;cursor:pointer;font-weight:600;font-variant-numeric:tabular-nums}
.slot[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#1D1D1F}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.field .lbl{font-size:13px;font-weight:600;color:var(--muted);margin:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
input,textarea{font:inherit;font-size:16px;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 12px;min-height:46px;width:100%;min-width:0;color:var(--ink)}
input[type=date]{-webkit-appearance:none;appearance:none;display:block;height:46px}
.price{display:flex;align-items:center;gap:8px}
.price input{font-weight:700;font-size:20px;font-variant-numeric:tabular-nums}
.price span{font-weight:700;font-size:18px}
.hint{font-size:13px;color:var(--muted);margin:0}
.check{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:12px;padding:10px 12px;min-height:46px;cursor:pointer;font-weight:600}
.check input{width:22px;height:22px;min-height:0;accent-color:var(--ink);flex:none}
.sumbox{background:var(--card);border-radius:16px;padding:14px;display:grid;gap:4px;font-size:14.5px}
.sumbox b{font-size:16px}
.navbtns{display:flex;gap:8px}
.navbtns .btn{flex:1}
.msg{background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:10px 12px;font-size:14px;margin:0}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px;margin:0;background:var(--card);border-radius:16px;padding:14px}
.facts div{min-width:0}
.facts dt{font-size:12.5px;color:var(--muted);font-weight:600}
.facts dd{margin:2px 0 0;font-weight:600;overflow-wrap:anywhere}
.statusbtns{display:flex;flex-wrap:wrap;gap:8px}
.statusbtns .btn{flex:1 1 140px;min-height:44px}
.plist{list-style:none;margin:0;padding:0;background:var(--card);border-radius:16px}
.plist li{display:flex;justify-content:space-between;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line)}
.plist li:last-child{border-bottom:0}
.plist small{display:block;color:var(--muted);font-size:13px}
.plist b{white-space:nowrap;font-variant-numeric:tabular-nums}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));background:var(--ink);color:#FFFFFF;padding:10px 18px;border-radius:999px;font-weight:600;z-index:30;box-shadow:0 10px 30px rgba(0,0,0,.25);white-space:nowrap}
@media (max-width:370px){.sum b{font-size:19px}.svcgrid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="demo-bar">Demo von <a href="/">Pilotwerk Digital</a> · Beispiele: <a href="/terminbuch/" aria-current="page">Friseur</a> · <a href="/terminbuch/nagelstudio/">Nagelstudio</a> · <a href="/terminbuch/spa/">Spa</a></div>

<header class="top">
  <div class="col">
    <div class="brandrow">
      <div class="brand"><b>Salon Muster</b><span>Terminbuch · Bad Berleburg</span></div>
      <button type="button" class="hbtn" id="openPrices">Preise</button>
    </div>
    <div class="weeknav">
      <button type="button" class="arrow" id="prevWeek" aria-label="Vorherige Woche"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
      <b id="monthLabel"></b>
      <button type="button" class="hbtn" id="toToday">Heute</button>
      <button type="button" class="arrow" id="nextWeek" aria-label="Nächste Woche"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg></button>
    </div>
    <div class="week" id="week" role="group" aria-label="Tag wählen"></div>
  </div>
</header>

<main>
  <div class="col">
    <div class="note" id="note" hidden><span>Beispieltermine zum Ausprobieren. Tippen Sie auf einen Termin, eine freie Lücke oder „Laufkundschaft“.</span><button type="button" id="clearExamples">Beispiele löschen</button></div>
    <div class="sum" id="sum"></div>
    <div class="staff" id="staff" role="group" aria-label="Nach Person filtern"></div>
    <div class="actions">
      <button type="button" class="btn primary" id="newBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Neuer Termin</button>
      <button type="button" class="btn dark" id="walkinBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="5" r="2"/><path d="M10 22l1.5-7L9 13l1-5 4 2 2 4M14 22l-1-5"/></svg>Laufkundschaft</button>
    </div>
    <div class="banner" id="banner"></div>
    <div class="agenda" id="agenda"></div>
    <p class="foot"><button type="button" id="resetAll">Beispieldaten zurücksetzen</button></p>
  </div>
</main>

<div class="ov" id="ov" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Termin" tabindex="-1"></div></div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script>
(function(){
'use strict';
var KEY='pw-terminbuch-salon-v2';
var HOURS={0:null,1:null,2:['09:00','18:00'],3:['09:00','18:00'],4:['09:00','18:00'],5:['09:00','18:00'],6:['08:30','13:30']};
var STAFF=[{id:'anna',name:'Anna',c:'#B4430B'},{id:'jonas',name:'Jonas',c:'#2F5DA8'},{id:'mia',name:'Mia',c:'#7A3EA6'}];
var SERVICES=[
 {id:'damen',name:'Damen: Waschen, Schneiden, Föhnen',dur:60,price:45,c:'#FF6A13'},
 {id:'herren',name:'Herrenhaarschnitt',dur:30,price:28,c:'#2F5DA8'},
 {id:'kinder',name:'Kinderhaarschnitt bis 12',dur:30,price:18,c:'#2E9E5B'},
 {id:'ansatz',name:'Ansatz färben',dur:60,price:45,c:'#B5338A'},
 {id:'faerben',name:'Färben komplett',dur:90,price:65,c:'#7A3EA6'},
 {id:'straehnen',name:'Strähnchen',dur:120,price:75,c:'#D49A00'},
 {id:'dauerwelle',name:'Dauerwelle',dur:120,price:45,c:'#8B5E3C'},
 {id:'bart',name:'Bart trimmen',dur:15,price:15,c:'#6E6E73'},
 {id:'brauen',name:'Augenbrauen zupfen',dur:15,price:8,c:'#C2185B'},
 {id:'braut',name:'Brautfrisur mit Probetermin',dur:120,price:89,c:'#C9A227'}];
var TAGS=['Stammkunde','Neukunde','Kurgast'];
var DURS=[15,30,45,60,90,120,150,180];
var WD=['So','Mo','Di','Mi','Do','Fr','Sa'];
var WDL=['Sonntag','Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag'];
var MON=['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];

function pad(n){return String(n).padStart(2,'0')}
function dstr(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function pdate(s){var p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2])}
function addDays(s,n){var d=pdate(s);d.setDate(d.getDate()+n);return dstr(d)}
function today(){return dstr(new Date())}
function toMin(t){var p=String(t).split(':').map(Number);return p[0]*60+(p[1]||0)}
function fromMin(m){return pad(Math.floor(m/60))+':'+pad(m%60)}
function nowMin(){var n=new Date();return n.getHours()*60+n.getMinutes()}
function uid(){return Math.random().toString(36).slice(2,10)}
function eur(n){return Number(n||0).toLocaleString('de-DE')+' €'}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function $(id){return document.getElementById(id)}
function svc(id){return SERVICES.find(function(s){return s.id===id})||SERVICES[0]}
function stf(id){return STAFF.find(function(s){return s.id===id})}
function hours(s){return HOURS[pdate(s).getDay()]}
function blocking(b){return b.status==='booked'||b.status==='done'}
function endOf(b){return toMin(b.start)+Number(b.dur)}
function longDate(s){var d=pdate(s);return WDL[d.getDay()]+', '+d.getDate()+'. '+MON[d.getMonth()]}
function nextOpen(s){var x=s;for(var i=0;i<8&&!hours(x);i++)x=addDays(x,1);return x}
function av(st){return '<span class="av" style="background:'+st.c+'" aria-hidden="true">'+esc(st.name.slice(0,1).toUpperCase())+'</span>'}

function seed(){
 var d0=nextOpen(today()),d1=nextOpen(addDays(d0,1)),d2=nextOpen(addDays(d1,1));
 function B(date,start,sid,staff,name,status,extra){var s=svc(sid);return Object.assign({id:uid(),date:date,start:start,dur:s.dur,serviceId:sid,staffId:staff,name:name,phone:'',price:s.price,status:status||'booked',tag:'Stammkunde',walkin:false,house:'',note:'',example:true},extra||{})}
 var sat=pdate(d0).getDay()===6;
 var list=sat?[

  if(t.hasAttribute('data-next')){w.step=3;renderWizard();return}
  if(t.hasAttribute('data-back')){readStep3();w.step=Math.max(1,w.step-1);renderWizard();return}
  if(t.hasAttribute('data-save')){saveWizard();return}
  return;
 }
 var b=state.bookings.find(function(x){return x.id===$('sheet').dataset.bid});if(!b)return;
 if(t.dataset.status){b.status=t.dataset.status;persist();closeSheet();render();toast('Gespeichert');return}
 if(t.dataset.edit){openWizard({step:3,editId:b.id,serviceId:b.serviceId,dur:b.dur,who:b.staffId,staffId:b.staffId,date:b.date,time:b.start,name:b.name,phone:b.phone,tag:b.tag||'Stammkunde',house:!!b.house,houseWhere:b.house||'',note:b.note||'',price:b.price,priceEdited:true,walkin:b.walkin});return}
 if(t.dataset.del){if(t.dataset.sure){state.bookings=state.bookings.filter(function(x){return x.id!==b.id});persist();closeSheet();render();toast('Termin gelöscht')}else{t.dataset.sure='1';t.textContent='Wirklich löschen?';t.style.color='var(--bad)'}}
});
$('sheet').addEventListener('change',function(e){
 if(!w)return;
 if(e.target.id==='wDate'&&e.target.value){w.date=e.target.value<today()?today():e.target.value;w.time=null;w.staffId=null;renderWizard()}
 if(e.target.id==='wHouse'){readStep3();w.house=e.target.checked;renderWizard();var f=$(w.house?'wWhere':'wHouse');if(f)f.focus()}
});
$('sheet').addEventListener('input',function(e){
 if(w&&e.target.id==='wPrice'){w.price=Number(e.target.value.replace(/[^0-9]/g,''))||0;w.priceEdited=true;$('wPriceHint').textContent=priceHint()}
});
render();
})();
</script>
</body>
</html>
