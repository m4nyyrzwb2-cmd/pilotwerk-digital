<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Nagelstudio Terminbuch Demo – Pilotwerk Digital</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<style>
@font-face{font-family:"Inter";src:url("/assets/fonts/inter-400.woff") format("woff");font-weight:400;font-display:swap}
@font-face{font-family:"Inter";src:url("/assets/fonts/inter-600.woff") format("woff");font-weight:500 600;font-display:swap}
@font-face{font-family:"Inter";src:url("/assets/fonts/inter-700.woff") format("woff");font-weight:700 800;font-display:swap}
@font-face{font-family:"Lora";src:url("/assets/fonts/lora-italic.woff") format("woff");font-style:italic;font-weight:400 700;font-display:swap}
/* Layout: one-person nail studio as a phone app. Blush paper, berry accents, script headings. Fixed bottom tab bar (Heute, Kalender, Kundinnen, Preise) with a round berry "+" above it. Heute: greeting -> big "next appointment" card -> three small numbers -> online requests to accept or decline -> today's list -> customers due for a gel refill. Kalender: month grid with polish-colour dots -> day list. Kundinnen: search + customer cards with favourite colour -> customer sheet with history. Preise: grouped price cards. Forms open as bottom sheets. Single light theme by design. */
:root{
  --bg:#FBF1F2; --card:#FFFFFF; --ink:#3B1F2B; --muted:#7D5D69; --line:#F1DFE4;
  --accent:#A8295F; --accent-soft:#FCE9F0; --accent-ink:#FFFFFF;
  --ok:#1E7B3A; --ok-soft:#E8F5EC; --warn:#8F5000; --warn-soft:#FFF4E5; --bad:#C0362C; --bad-soft:#FDECEA;
  --font:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --script:"Lora",Georgia,serif;
  --shadow:0 10px 26px -16px rgba(122,40,80,.45);
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15.5px/1.45 var(--font);-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
button{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.demo-bar{background:var(--accent-soft);color:var(--ink);font:600 13.5px/1.3 var(--font);text-align:center;padding:7px max(16px,env(safe-area-inset-left,0px));padding-top:calc(7px + env(safe-area-inset-top,0px))}
.demo-bar a{color:var(--accent);font-weight:700}
.demo-bar a[aria-current="page"]{text-decoration:none;border-radius:999px;padding:1px 8px;background:rgba(0,0,0,.07)}
.col{max-width:620px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.script{font-family:var(--script);font-style:italic;font-weight:600}

/* Header */
.head{padding:18px 0 4px}
.head .col{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.head b{display:block;font-family:var(--script);font-style:italic;font-weight:600;font-size:28px;line-height:1.1;color:var(--accent)}
.head span{font-size:13px;color:var(--muted)}
.avatar{width:44px;height:44px;border-radius:50%;background:var(--accent);color:#FFFFFF;display:grid;place-items:center;font-weight:700;flex:none}

main{padding-bottom:calc(150px + env(safe-area-inset-bottom,0px))}
.view{display:flex;flex-direction:column;gap:16px;padding-top:12px}
h1{margin:6px 0 0;font-family:var(--script);font-style:italic;font-weight:600;font-size:30px;line-height:1.15}
.date{margin:0;color:var(--muted)}
h2{margin:8px 0 -6px;font-family:var(--script);font-style:italic;font-weight:600;font-size:22px;display:flex;align-items:center;gap:8px}
h2 .count{font-family:var(--font);font-style:normal;font-size:12.5px;font-weight:700;background:var(--accent);color:#FFFFFF;border-radius:999px;padding:1px 8px}

/* Next appointment card */
.next{background:var(--accent);color:#FFFFFF;border-radius:24px;padding:18px;display:flex;flex-direction:column;gap:10px;box-shadow:0 18px 34px -18px rgba(168,41,95,.75)}
.next .lab{font-size:13px;font-weight:600;opacity:.85;display:flex;justify-content:space-between;gap:8px}
.next .big{display:flex;align-items:baseline;gap:12px}
.next .big b{font-size:40px;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.next .big span{font-size:18px;font-weight:700}
.next p{margin:0;opacity:.92}
.next .row{display:flex;flex-wrap:wrap;gap:8px}
.next .row button{border:0;border-radius:999px;padding:8px 16px;min-height:42px;font-weight:600;cursor:pointer;background:rgba(255,255,255,.18);color:#FFFFFF}
.next .row button.solid{background:#FFFFFF;color:var(--accent)}
.swatch{display:inline-block;width:14px;height:14px;border-radius:50%;background:var(--sw);box-shadow:inset 0 0 0 1px rgba(0,0,0,.12);vertical-align:-2px;flex:none}
.next .swatch{box-shadow:0 0 0 2px rgba(255,255,255,.7)}

.nums{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.nums div{background:var(--card);border-radius:18px;padding:12px;box-shadow:var(--shadow);min-width:0}
.nums b{display:block;font-size:21px;font-variant-numeric:tabular-nums;color:var(--accent);white-space:nowrap}
.nums span{font-size:12.5px;color:var(--muted)}

/* Cards and rows */
.card{background:var(--card);border-radius:20px;padding:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px}
.req .top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.req b{font-size:16px}
.req small{color:var(--muted);font-size:13px}
.src{font-size:12px;font-weight:700;border-radius:999px;padding:2px 9px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.pair{display:flex;gap:8px}
.pair .btn{flex:1}
.list{display:flex;flex-direction:column;gap:8px}
.item{width:100%;text-align:left;border:0;background:var(--card);border-radius:18px;padding:12px 14px;display:grid;grid-template-columns:54px minmax(0,1fr) auto;gap:10px;align-items:center;cursor:pointer;box-shadow:var(--shadow)}
.item .t{font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}
.item .t small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.item .w{min-width:0}
.item .w b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .w span{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:13.5px;min-width:0}
.item .w span em{font-style:normal;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item.cancelled,.item.noshow{opacity:.55}
.item.cancelled b,.item.noshow b{text-decoration:line-through}
.pill{font-size:12px;font-weight:600;border-radius:999px;padding:2px 8px;white-space:nowrap}
.pill.done{background:var(--ok-soft);color:var(--ok)}
.pill.noshow{background:var(--warn-soft);color:var(--warn)}
.pill.cancelled{background:var(--bad-soft);color:var(--bad)}
.pill.booked{background:var(--accent-soft);color:var(--accent)}
.due{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;align-items:center}
.due .swatch{width:34px;height:34px;grid-row:span 2}
.due b{font-size:15.5px}
.due small{color:var(--muted);font-size:13px}
.due .pair{grid-column:1/-1;margin-top:6px}
.empty{background:var(--card);border-radius:18px;padding:18px;text-align:center;color:var(--muted);box-shadow:var(--shadow)}
.btn{border:1px solid var(--line);background:var(--card);border-radius:999px;min-height:44px;padding:8px 16px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#FFFFFF}
.btn.wa{background:var(--ok-soft);border-color:var(--ok-soft);color:var(--ok)}
.btn.ghost{background:transparent}
.note{background:var(--accent-soft);border-radius:18px;padding:12px 14px;font-size:14px;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between}
.note button{border:0;background:#FFFFFF;border-radius:999px;padding:6px 12px;min-height:36px;font-weight:600;font-size:13.5px;cursor:pointer}

/* Calendar */
.mhead{display:flex;align-items:center;justify-content:space-between;gap:8px}
.mhead b{font-family:var(--script);font-style:italic;font-weight:600;font-size:24px}
.round{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;cursor:pointer}
.round svg{width:18px;height:18px}
.month{background:var(--card);border-radius:22px;padding:10px;box-shadow:var(--shadow)}
.dow,.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.dow span{text-align:center;font-size:12px;font-weight:600;color:var(--muted);padding:4px 0}
.cell{border:0;background:transparent;border-radius:14px;min-height:50px;padding:6px 0 4px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;font-variant-numeric:tabular-nums}
.cell.out{opacity:.35}
.cell.closed b{color:var(--muted);font-weight:500}
.cell.today b{color:var(--accent);font-weight:800}
.cell[aria-pressed="true"]{background:var(--accent-soft);box-shadow:inset 0 0 0 2px var(--accent)}
.dots{display:flex;gap:2px;min-height:7px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--sw);box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}

/* Customers */
.search{position:relative}
.search input{padding-left:40px}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted)}
.cust{width:100%;text-align:left;border:0;background:var(--card);border-radius:18px;padding:12px 14px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:2px 12px;align-items:center;cursor:pointer;box-shadow:var(--shadow)}
.cust .swatch{width:36px;height:36px;grid-row:span 2}
.cust b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cust small{grid-column:2;color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cust .chev{grid-row:1/3;grid-column:3;color:var(--muted)}

/* Prices */
.pcard{background:var(--card);border-radius:20px;box-shadow:var(--shadow);overflow:hidden}
.pcard h3{margin:0;padding:12px 14px 4px;font-family:var(--script);font-style:italic;font-weight:600;font-size:20px;color:var(--accent)}
.pcard ul{list-style:none;margin:0;padding:0 14px 6px}
.pcard li{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.pcard li:last-child{border-bottom:0}
.pcard small{display:block;color:var(--muted);font-size:13px}
.pcard li b{white-space:nowrap;font-variant-numeric:tabular-nums}
.small{font-size:13px;color:var(--muted);margin:0}

/* Tab bar and FAB */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:8;background:rgba(255,255,255,.96);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
@supports ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.tabbar{background:rgba(255,255,255,.82);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}}
.tabbar .col{display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.tab{position:relative;border:0;background:transparent;min-height:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11.5px;font-weight:600;color:var(--muted);cursor:pointer}
.tab svg{width:24px;height:24px}
.tab[aria-current="page"]{color:var(--accent)}
.tab .badge{position:absolute;top:6px;left:calc(50% + 6px);min-width:18px;height:18px;border-radius:999px;background:var(--accent);color:#FFFFFF;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 5px}
.fab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(74px + env(safe-area-inset-bottom,0px));z-index:9;width:58px;height:58px;border-radius:50%;border:0;background:var(--accent);color:#FFFFFF;display:grid;place-items:center;cursor:pointer;box-shadow:0 14px 28px -10px rgba(168,41,95,.7)}
.fab svg{width:26px;height:26px}
@media (min-width:700px){.fab{right:calc(50% - 300px)}}

/* Sheets */
.ov{position:fixed;inset:0;background:rgba(59,31,43,.42);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:min(560px,100%);max-height:92%;overflow:auto;border-radius:26px 26px 0 0;padding:18px max(16px,env(safe-area-inset-left,0px)) calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
.sheet:focus{outline:none}
@media (min-width:700px){.ov{align-items:center}.sheet{border-radius:26px;padding:22px 24px}}
.sh{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sh h3{margin:0;font-family:var(--script);font-style:italic;font-weight:600;font-size:26px;color:var(--accent);line-height:1.15}
.sh p{margin:2px 0 0;color:var(--muted);font-size:14px}
.x{width:40px;height:40px;border-radius:50%;border:0;background:var(--card);cursor:pointer;display:grid;place-items:center;flex:none}
.x svg{width:18px;height:18px}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.lbl{font-size:13px;font-weight:600;color:var(--muted)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
input,select,textarea{font:inherit;font-size:16px;border:1px solid #EBCBD6;background:var(--card);border-radius:14px;padding:10px 12px;min-height:46px;width:100%;min-width:0;color:var(--ink)}
input[type=date]{-webkit-appearance:none;appearance:none;display:block;height:46px}
.colors{display:flex;flex-wrap:wrap;gap:6px}
.cbtn{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 10px 5px 6px;min-height:38px;display:inline-flex;align-items:center;gap:6px;font-size:13.5px;font-weight:600;cursor:pointer}
.cbtn .swatch{width:22px;height:22px}
.cbtn[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);color:var(--accent)}
.price{display:flex;align-items:center;gap:8px}
.price input{font-weight:700;font-size:20px;font-variant-numeric:tabular-nums}
.price span{font-weight:700;font-size:18px}
.hint{font-size:13px;color:var(--muted);margin:0}
.msg{background:var(--warn-soft);color:var(--warn);border-radius:14px;padding:10px 12px;font-size:14px;margin:0}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px;margin:0;background:var(--card);border-radius:18px;padding:14px}
.facts div{min-width:0}
.facts dt{font-size:12.5px;color:var(--muted);font-weight:600}
.facts dd{margin:2px 0 0;font-weight:600;overflow-wrap:anywhere;display:flex;align-items:center;gap:6px}
.wrapbtns{display:flex;flex-wrap:wrap;gap:8px}
.wrapbtns .btn{flex:1 1 130px}
.hist{list-style:none;margin:0;padding:0;background:var(--card);border-radius:18px}
.hist li{display:flex;justify-content:space-between;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);font-size:14px}
.hist li:last-child{border-bottom:0}
.hist li span{color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom,0px));background:var(--ink);color:#FFFFFF;padding:10px 18px;border-radius:999px;font-weight:600;z-index:30;box-shadow:0 10px 30px rgba(0,0,0,.25);white-space:nowrap}
@media (max-width:370px){.nums b{font-size:18px}.next .big b{font-size:34px}}
</style>
</head>
<body>
<div class="demo-bar">Demo von <a href="/">Pilotwerk Digital</a> · Beispiele: <a href="/terminbuch/">Friseur</a> · <a href="/terminbuch/nagelstudio/" aria-current="page">Nagelstudio</a> · <a href="/terminbuch/spa/">Spa</a></div>

<header class="head">
  <div class="col">
    <div><b>Nagelstudio Muster</b><span>Lisa · Mo–Fr 9–17 Uhr · nur Gel, kein Acryl</span></div>
    <span class="avatar" aria-hidden="true">L</span>

</header>

<main>
  <div class="col">
    <section class="view" id="vHeute" aria-label="Heute"></section>
    <section class="view" id="vKal" aria-label="Kalender" hidden></section>
    <section class="view" id="vKund" aria-label="Kundinnen" hidden></section>
    <section class="view" id="vPreise" aria-label="Preise" hidden></section>

</main>

<button type="button" class="fab" id="fab" aria-label="Neuer Termin"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
<nav class="tabbar" aria-label="Bereiche">

    <button type="button" class="tab" data-tab="vHeute" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>Heute<span class="badge" id="badge" hidden></span></button>
    <button type="button" class="tab" data-tab="vKal"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="3"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>Kalender</button>
    <button type="button" class="tab" data-tab="vKund"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="4"/><path d="M2 21c0-4 3-6 7-6s7 2 7 6M17 11a3 3 0 1 0 0-6M22 21c0-3-1.5-5-4-5.6"/></svg>Kundinnen</button>
    <button type="button" class="tab" data-tab="vPreise"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.6 13.4 13.4 20.6a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8z"/><circle cx="7.5" cy="7.5" r="1.5"/></svg>Preise</button>
  </div>
</nav>

<div class="ov" id="ov" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Details" tabindex="-1"></div></div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script>
(function(){
'use strict';
var KEY='pw-terminbuch-nails-v2';
var OWNER='Lisa',STUDIO='Nagelstudio Muster';
var HOURS={0:null,1:['09:00','17:00'],2:['09:00','17:00'],3:['09:00','17:00'],4:['09:00','17:00'],5:['09:00','17:00'],6:null};
var SERVICES=[
 {id:'mani',name:'Maniküre',dur:30,price:22,cat:'Hände'},
 {id:'uvlack',name:'UV-Lack (Shellac)',dur:60,price:32,cat:'Hände'},
 {id:'neu',name:'Gel-Neumodellage',dur:120,price:55,cat:'Hände',gel:true},
 {id:'auff',name:'Gel auffüllen',dur:90,price:42,cat:'Hände',gel:true},
 {id:'abloesen',name:'Ablösen',dur:30,price:15,cat:'Hände'},
 {id:'rep',name:'Nagelreparatur (1 Nagel)',dur:15,price:5,cat:'Hände'},
 {id:'fuss',name:'Kosmetische Fußpflege',dur:45,price:30,cat:'Füße'},
 {id:'fusslack',name:'Fußpflege mit Lack',dur:60,price:38,cat:'Füße'},
 {id:'art',name:'Nail Art (2 Nägel)',dur:15,price:6,cat:'Extras'}];
var COLORS={'Nude':'#E3BFA8','Kirschrot':'#A3122A','French':'#F6F0EA','Babyblau':'#A9CCE8','Mauve':'#B784A7','Schwarz matt':'#2B2B2B','Rosé Glitzer':'#E8A3B5','Milky White':'#F1ECE6','Beere':'#A8295F','Salbei':'#A8BBA0'};
var DURS=[15,30,45,60,75,90,105,120,150,180];
var WDL=['Sonntag','Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag'];
var WDS=['So.','Mo.','Di.','Mi.','Do.','Fr.','Sa.'];
var MON=['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];

function pad(n){return String(n).padStart(2,'0')}
function dstr(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function pdate(s){var p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2])}
function addDays(s,n){var d=pdate(s);d.setDate(d.getDate()+n);return dstr(d)}
function today(){return dstr(new Date())}
function toMin(t){var p=String(t).split(':').map(Number);return p[0]*60+(p[1]||0)}
function fromMin(m){return pad(Math.floor(m/60))+':'+pad(m%60)}
function nowMin(){var n=new Date();return n.getHours()*60+n.getMinutes()}
function uid(){return Math.random().toString(36).slice(2,10)}
function eur(n){return Number(n||0).toLocaleString('de-DE')+' €'}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function $(id){return document.getElementById(id)}
function svc(id){return SERVICES.find(function(s){return s.id===id})||SERVICES[0]}
function hours(s){return HOURS[pdate(s).getDay()]}
function nextOpen(s){var x=s;for(var i=0;i<8&&!hours(x);i++)x=addDays(x,1);return x}
function blocking(b){return b.status==='booked'||b.status==='done'}
function endOf(b){return toMin(b.start)+Number(b.dur)}
function longDate(s){var d=pdate(s);return WDL[d.getDay()]+', '+d.getDate()+'. '+MON[d.getMonth()]}
function shortDate(s){var d=pdate(s);return WDS[d.getDay()]+' '+d.getDate()+'.'+(d.getMonth()+1)+'.'}
function daysBetween(a,b){return Math.round((pdate(b)-pdate(a))/864e5)}
function sw(color){return '<span class="swatch" style="--sw:'+(COLORS[color]||'#E3BFA8')+'" aria-hidden="true"></span>'}

 var d0=nextOpen(today()),d1=nextOpen(addDays(d0,1)),d2=nextOpen(addDays(d1,1));
 var C=[
  {id:'c1',name:'Melanie S.',phone:'',color:'Nude',note:'Mag es kurz und rund.'},
  {id:'c2',name:'Aylin K.',phone:'',color:'Kirschrot',note:''},

  {id:'c5',name:'Nadine T.',phone:'0151 1234567',color:'Mauve',note:'Nur hypoallergenes Gel.'},
  {id:'c6',name:'Vanessa R.',phone:'0160 7654321',color:'Schwarz matt',note:'Mandelform.'},
  {id:'c7',name:'Julia W.',phone:'',color:'Rosé Glitzer',note:''},
  {id:'c8',name:'Carina P.',phone:'',color:'Milky White',note:'Reha-Gast bis Ende des Monats.'},
  {id:'c9',name:'Lea M.',phone:'',color:'Salbei',note:''}];
 function B(date,start,sid,cid,status,extra){var s=svc(sid);return Object.assign({id:uid(),date:date,start:start,dur:s.dur,serviceId:sid,customerId:cid,price:s.price,status:status||'booked',color:(C.find(function(c){return c.id===cid})||{}).color||'',note:'',example:true},extra||{})}
 var b=[
  B(d0,'09:00','uvlack','c1','done'),B(d0,'10:00','neu','c2','done'),B(d0,'12:30','mani','c3'),
  B(d0,'13:30','auff','c4'),B(d0,'15:00','fusslack','c7'),B(d0,'16:15','rep','c8',null,{note:'Nagel am Ringfinger eingerissen'}),

  B(addDays(d0,-22),'13:00','neu','c4','done'),B(addDays(d0,-28),'10:00','uvlack','c1','done'),B(addDays(d0,-30),'15:00','auff','c7','done'),
  B(addDays(d0,-45),'10:00','fuss','c3','done'),B(addDays(d0,-49),'10:00','neu','c6','done')];
 var r=[
  {id:'r1',name:'Emily F.',phone:'0157 2223334',serviceId:'neu',date:d1,start:'11:30',source:'Website',note:'Erstes Mal Gel, gerne Nude.',at:'vor 2 Std.'},
  {id:'r2',name:'Frau Dietz',phone:'0171 9998887',serviceId:'fuss',date:d2,start:'09:00',source:'WhatsApp',note:'Kurgast, wohnt im Kurhotel.',at:'gestern'}];
 return {v:2,customers:C,bookings:b,requests:r};

function load(){try{var s=localStorage.getItem(KEY);if(s){var o=JSON.parse(s);if(o&&o.v===2&&Array.isArray(o.bookings)&&Array.isArray(o.customers))return o}}catch(e){}return null}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
var state=load()||seed();
if(!Array.isArray(state.requests))state.requests=[];
var ui={tab:'vHeute',calDate:nextOpen(today()),month:null,q:''};

function cust(id){return state.customers.find(function(c){return c.id===id})}
function custName(b){var c=cust(b.customerId);return c?c.name:'Kundin'}
function dayList(s){return state.bookings.filter(function(b){return b.date===s}).sort(function(a,b){return toMin(a.start)-toMin(b.start)})}
function conflict(date,start,dur,exId){var s=toMin(start),e=s+dur;return state.bookings.find(function(b){return b.id!==exId&&b.date===date&&blocking(b)&&toMin(b.start)<e&&s<endOf(b)})}
function lastGel(cid){var l=state.bookings.filter(function(b){return b.customerId===cid&&b.status==='done'&&svc(b.serviceId).gel}).sort(function(a,b){return a.date<b.date?1:-1});return l[0]}
function upcoming(cid){var t=today();return state.bookings.some(function(b){return b.customerId===cid&&b.date>=t&&b.status==='booked'})}
function dueList(){var t=today();return state.customers.map(function(c){var g=lastGel(c.id);return g&&!upcoming(c.id)?{c:c,days:daysBetween(g.date,t)}:null}).filter(function(x){return x&&x.days>=21}).sort(function(a,b){return b.days-a.days})}
function visits(cid){return state.bookings.filter(function(b){return b.customerId===cid&&b.status==='done'})}
function waLink(phone,text){var dg=String(phone||'').replace(/[^0-9]/g,'');if(!dg)return '';if(dg.indexOf('00')===0)dg=dg.slice(2);else if(dg.indexOf('0')===0)dg='49'+dg.slice(1);return 'https://wa.me/'+dg+'?text='+encodeURIComponent(text)}

var toastTimer;
function toast(m){var el=$('toast');el.textContent=m;el.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(function(){el.hidden=true},2400)}

function itemRow(b){
 var s=svc(b.serviceId),lab={booked:'',done:'Erledigt',noshow:'Nicht da',cancelled:'Abgesagt'}[b.status];
 return '<button type="button" class="item '+b.status+'" data-bid="'+b.id+'"><span class="t">'+b.start+'<small>'+b.dur+' Min.</small></span><span class="w"><b>'+esc(custName(b))+'</b><span>'+(b.color?sw(b.color):'')+'<em>'+esc(s.name)+(b.color?' · '+esc(b.color):'')+'</em></span></span>'+(lab?'<span class="pill '+b.status+'">'+lab+'</span>':'<span class="pill booked">'+eur(b.price)+'</span>')+'</button>';
}

/* Heute */
function renderHeute(){
 var t=today(),hr=hours(t),nm=nowMin(),h='';
 var greet=nm<11*60?'Guten Morgen':(nm<18*60?'Guten Tag':'Guten Abend');
 h+='<div><h1>'+greet+', '+OWNER+'</h1><p class="date">'+esc(longDate(t))+(hr?' · geöffnet '+hr[0]+'–'+hr[1]+' Uhr':' · heute geschlossen')+'</p></div>';
 if(state.bookings.some(function(b){return b.example}))h+='<div class="note"><span>Beispieldaten zum Ausprobieren: Anfrage annehmen, Termin antippen, Kundin anlegen.</span><button type="button" data-act="reset">Zurücksetzen</button></div>';
 var day=hr?t:nextOpen(t),list=dayList(day),nxt=null,running=false;
 for(var i=0;i<list.length;i++){var b=list[i];if(b.status!=='booked')continue;if(day!==t){nxt=b;break}if(endOf(b)>nm){nxt=b;running=toMin(b.start)<=nm;break}}
 if(!nxt&&day===t){var nd=nextOpen(addDays(t,1)),l2=dayList(nd).filter(function(b){return b.status==='booked'});if(l2.length){nxt=l2[0];day=nd}}
 if(nxt){
  var s=svc(nxt.serviceId),c=cust(nxt.customerId),when;
  if(nxt.date===t){var diff=toMin(nxt.start)-nm;when=running?'Läuft gerade':(diff<60?'in '+diff+' Min.':'in '+Math.floor(diff/60)+' Std. '+(diff%60?diff%60+' Min.':''))}else when=longDate(nxt.date);
  h+='<div class="next"><div class="lab"><span>Als Nächstes</span><span>'+esc(when)+'</span></div><div class="big"><b>'+nxt.start+'</b><span>'+esc(c?c.name:'Kundin')+'</span></div><p>'+esc(s.name)+' · '+nxt.dur+' Min. · '+eur(nxt.price)+(nxt.color?'<br>'+sw(nxt.color)+' Wunschfarbe: '+esc(nxt.color):'')+(c&&c.note?'<br>'+esc(c.note):'')+'</p><div class="row">'+(nxt.date===t?'<button type="button" class="solid" data-done="'+nxt.id+'">Erledigt</button>':'')+'<button type="button" data-bid="'+nxt.id+'">Details</button></div></div>';
 }else h+='<div class="empty">Keine offenen Termine. Zeit für einen Kaffee.</div>';
 var tl=dayList(t).filter(blocking),done=tl.filter(function(b){return b.status==='done'}).reduce(function(s,b){return s+b.price},0);
 var freeMin=0;if(hr){var from=Math.max(toMin(hr[0]),nm),to=toMin(hr[1]);for(var m=Math.ceil(from/15)*15;m<to;m+=15){if(!conflict(t,fromMin(m),15))freeMin+=15}}
 h+='<div class="nums"><div><b>'+tl.length+'</b><span>Termine heute</span></div><div><b>'+eur(done)+'</b><span>Umsatz erledigt</span></div><div><b>'+(freeMin>=60?Math.floor(freeMin/60)+' h '+(freeMin%60?freeMin%60+'′':''):freeMin+' Min.')+'</b><span>noch frei heute</span></div></div>';
 if(state.requests.length){
  h+='<h2>Neue Anfragen <span class="count">'+state.requests.length+'</span></h2><div class="list">'+state.requests.map(function(r){var s=svc(r.serviceId),cf=conflict(r.date,r.start,s.dur);return '<div class="card req"><div class="top"><div><b>'+esc(r.name)+'</b><br><small>'+esc(s.name)+' · Wunsch: '+esc(shortDate(r.date))+' um '+r.start+' Uhr</small></div><span class="src">'+esc(r.source)+'</span></div>'+(r.note?'<small>„'+esc(r.note)+'“ · '+esc(r.at)+'</small>':'')+(cf?'<p class="msg">Um '+r.start+' Uhr ist schon '+esc(custName(cf))+' eingetragen. Beim Annehmen können Sie die Zeit ändern.</p>':'')+'<div class="pair"><button type="button" class="btn" data-decline="'+r.id+'">Ablehnen</button><button type="button" class="btn primary" data-accept="'+r.id+'">Annehmen</button></div></div>'}).join('')+'</div>';
  h+='<p class="small">Kundinnen fragen über die Website oder WhatsApp an. Sie bestätigen mit einem Tipp, auch zwischen zwei Kundinnen, ohne ans Telefon zu müssen.</p>';
 }
 h+='<h2>Heute im Studio</h2>';
 var all=dayList(t);h+=all.length?'<div class="list">'+all.map(itemRow).join('')+'</div>':'<div class="empty">'+(hr?'Heute sind noch keine Termine eingetragen.':'Heute ist das Studio geschlossen.')+'</div>';
 var due=dueList();
 if(due.length){
  h+='<h2>Fällig zum Auffüllen</h2><div class="list">'+due.map(function(x){var c=x.c,wa=waLink(c.phone,'Hallo '+c.name.split(' ')[0]+', deine Gel-Nägel sind bald fällig zum Auffüllen. Soll ich dir einen Termin eintragen? Liebe Grüße, '+OWNER+' vom '+STUDIO);return '<div class="card due">'+sw(c.color)+'<b>'+esc(c.name)+'</b><small>Letztes Gel vor '+x.days+' Tagen · '+esc(c.color)+'</small><div class="pair">'+(wa?'<a class="btn wa" href="'+esc(wa)+'" target="_blank" rel="noopener">WhatsApp</a>':'')+'<button type="button" class="btn primary" data-book-cust="'+c.id+'" data-svc="auff">Termin eintragen</button></div></div>'}).join('')+'</div>';
 }
 $('vHeute').innerHTML=h;
 var b=$('badge');b.hidden=!state.requests.length;b.textContent=state.requests.length;
}

/* Kalender */
function renderKal(){
 if(!ui.month)ui.month=ui.calDate.slice(0,7);
 var p=ui.month.split('-').map(Number),first=new Date(p[0],p[1]-1,1),start=new Date(first);start.setDate(1-((first.getDay()+6)%7));
 var h='<div class="mhead"><button type="button" class="round" data-month="-1" aria-label="Vorheriger Monat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button><b>'+MON[p[1]-1]+' '+p[0]+'</b><button type="button" class="round" data-month="1" aria-label="Nächster Monat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg></button></div>';
 h+='<div class="month"><div class="dow" aria-hidden="true"><span>Mo</span><span>Di</span><span>Mi</span><span>Do</span><span>Fr</span><span>Sa</span><span>So</span></div><div class="grid">';
 var t=today();
 for(var i=0;i<42;i++){var d=new Date(start);d.setDate(start.getDate()+i);var ds=dstr(d),list=dayList(ds).filter(blocking),out=d.getMonth()!==p[1]-1;
  if(i>=35&&out&&d.getDay()===1)break;
  h+='<button type="button" class="cell'+(out?' out':'')+(hours(ds)?'':' closed')+(ds===t?' today':'')+'" data-cal="'+ds+'" aria-pressed="'+(ds===ui.calDate)+'" aria-label="'+esc(longDate(ds))+', '+list.length+' Termine"><b>'+d.getDate()+'</b><span class="dots">'+list.slice(0,4).map(function(b){return '<i style="--sw:'+(COLORS[b.color]||'#E3BFA8')+'"></i>'}).join('')+'</span></button>'}
 h+='</div></div>';
 var dl=dayList(ui.calDate);
 h+='<h2>'+esc(longDate(ui.calDate))+'</h2>';
 h+=hours(ui.calDate)?'':'<p class="small">An diesem Tag ist das Studio normalerweise geschlossen.</p>';
 h+=dl.length?'<div class="list">'+dl.map(itemRow).join('')+'</div>':'<div class="empty">Keine Termine an diesem Tag.</div>';
 h+='<button type="button" class="btn primary" data-new-on="'+ui.calDate+'">Termin an diesem Tag</button>';
 $('vKal').innerHTML=h;
}

/* Kundinnen */
function renderKund(){
 var q=ui.q.trim().toLowerCase(),t=today();
 var list=state.customers.filter(function(c){return !q||c.name.toLowerCase().indexOf(q)>=0||String(c.color).toLowerCase().indexOf(q)>=0}).sort(function(a,b){return a.name.localeCompare(b.name,'de')});
 var h='<h1>Kundinnen</h1><div class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input type="search" id="q" placeholder="Name oder Farbe suchen" aria-label="Kundin suchen" value="'+esc(ui.q)+'"></div>';
 h+='<button type="button" class="btn" data-act="newcust">+ Neue Kundin</button><div class="list" id="custList">';
 h+=list.length?list.map(function(c){var v=visits(c.id),last=v.sort(function(a,b){return a.date<b.date?1:-1})[0];return '<button type="button" class="cust" data-cust="'+c.id+'">'+sw(c.color)+'<b>'+esc(c.name)+'</b><small>'+v.length+' Besuche'+(last?' · zuletzt vor '+daysBetween(last.date,t)+' Tagen':'')+' · '+esc(c.color||'keine Farbe')+'</small><span class="chev" aria-hidden="true">›</span></button>'}).join(''):'<div class="empty">Keine Kundin gefunden.</div>';
 h+='</div>';
 $('vKund').innerHTML=h;
}

/* Preise */
function renderPreise(){
 var cats=['Hände','Füße','Extras'],h='<h1>Preise</h1>';
 cats.forEach(function(cat){h+='<div class="pcard"><h3>'+cat+'</h3><ul>'+SERVICES.filter(function(s){return s.cat===cat}).map(function(s){return '<li><span>'+esc(s.name)+'<small>'+s.dur+' Min.</small></span><b>'+eur(s.price)+'</b></li>'}).join('')+'</ul></div>'});
 h+='<p class="small">Wir arbeiten nur mit Gel, kein Acryl. Gel-Nägel sollten nach 3 bis 4 Wochen aufgefüllt werden. Das Terminbuch erinnert Sie daran.</p>';
 $('vPreise').innerHTML=h;
}

function render(){
 ['vHeute','vKal','vKund','vPreise'].forEach(function(v){$(v).hidden=ui.tab!==v});
 document.querySelectorAll('.tab').forEach(function(b){if(b.dataset.tab===ui.tab)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});
 renderHeute();if(ui.tab==='vKal')renderKal();if(ui.tab==='vKund')renderKund();if(ui.tab==='vPreise')renderPreise();
}

/* Sheets */
var lastFocus=null,form=null;
var X='<button type="button" class="x" data-close aria-label="Schließen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>';
function openSheet(html){lastFocus=document.activeElement;$('sheet').innerHTML=html;$('ov').hidden=false;document.body.style.overflow='hidden';$('sheet').scrollTop=0;$('sheet').focus({preventScroll:true})}
function closeSheet(){$('ov').hidden=true;$('sheet').innerHTML='';$('sheet').dataset.bid='';$('sheet').dataset.cid='';document.body.style.overflow='';form=null;if(lastFocus&&lastFocus.focus)lastFocus.focus()}

function timeOptions(date,sel){var hr=hours(date)||['09:00','17:00'],o=toMin(hr[0]),c=toMin(hr[1]),l=[];for(var m=o;m<c;m+=15)l.push(fromMin(m));if(sel&&l.indexOf(sel)<0)l.unshift(sel);return l.map(function(t){return '<option'+(t===sel?' selected':'')+'>'+t+'</option>'}).join('')}
function firstFree(date,dur){var hr=hours(date);if(!hr)return '09:00';var o=toMin(hr[0]);if(date===today())o=Math.max(o,Math.ceil(nowMin()/15)*15);for(var m=o;m+dur<=toMin(hr[1]);m+=15)if(!conflict(date,fromMin(m),dur))return fromMin(m);return hr[0]}

function openBooking(p){
 form=Object.assign({editId:null,customerId:'',newName:'',newPhone:'',serviceId:'mani',date:nextOpen(today()),start:null,dur:null,price:null,priceEdited:false,color:'',note:'',fromRequest:null,force:false},p||{});
 var s=svc(form.serviceId);if(!form.dur)form.dur=s.dur;if(form.price==null)form.price=s.price;
 if(!form.start)form.start=firstFree(form.date,form.dur);
 if(!form.color&&form.customerId){var c=cust(form.customerId);if(c)form.color=c.color}
 renderBooking();
}
function readBooking(){if(!form)return;var g=function(id){var e=$(id);return e?e.value:''};form.customerId=g('bCust');form.newName=g('bNewName')||form.newName;form.newPhone=g('bNewPhone')||form.newPhone;form.serviceId=g('bSvc');form.date=g('bDate')||form.date;form.start=g('bTime')||form.start;form.dur=Number(g('bDur'))||form.dur;form.note=g('bNote')}
function priceHint(){var s=svc(form.serviceId);if(form.priceEdited)return 'Preis von Hand geändert.';if(form.dur===s.dur)return 'Preis laut Preisliste.';return 'Anteilig berechnet ('+s.dur+' Min. = '+eur(s.price)+'). Sie können ihn ändern.'}
function renderBooking(){
 var s=svc(form.serviceId);if(!form.priceEdited)form.price=Math.round(s.price*form.dur/s.dur);
 var cf=conflict(form.date,form.start,form.dur,form.editId);
 var h='<div class="sh"><div><h3>'+(form.editId?'Termin ändern':(form.fromRequest?'Anfrage annehmen':'Neuer Termin'))+'</h3><p>'+esc(longDate(form.date))+'</p></div>'+X+'</div>';
 h+='<div class="field"><label for="bCust">Kundin</label><select id="bCust"><option value="">Neue Kundin …</option>'+state.customers.slice().sort(function(a,b){return a.name.localeCompare(b.name,'de')}).map(function(c){return '<option value="'+c.id+'"'+(c.id===form.customerId?' selected':'')+'>'+esc(c.name)+'</option>'}).join('')+'</select></div>';
 if(!form.customerId)h+='<div class="two"><div class="field"><label for="bNewName">Name</label><input id="bNewName" autocomplete="off" value="'+esc(form.newName)+'" placeholder="z. B. Emily F."></div><div class="field"><label for="bNewPhone">WhatsApp</label><input id="bNewPhone" inputmode="tel" autocomplete="off" value="'+esc(form.newPhone)+'" placeholder="0151 …"></div></div>';
 h+='<div class="field"><label for="bSvc">Leistung</label><select id="bSvc">'+['Hände','Füße','Extras'].map(function(cat){return '<optgroup label="'+cat+'">'+SERVICES.filter(function(x){return x.cat===cat}).map(function(x){return '<option value="'+x.id+'"'+(x.id===form.serviceId?' selected':'')+'>'+esc(x.name)+' · '+x.dur+' Min. · '+eur(x.price)+'</option>'}).join('')+'</optgroup>'}).join('')+'</select></div>';
 h+='<div class="two"><div class="field"><label for="bDate">Tag</label><input type="date" id="bDate" value="'+form.date+'"></div><div class="field"><label for="bTime">Uhrzeit</label><select id="bTime">'+timeOptions(form.date,form.start)+'</select></div></div>';
 h+='<div class="two"><div class="field"><label for="bDur">Dauer</label><select id="bDur">'+DURS.concat(DURS.indexOf(form.dur)<0?[form.dur]:[]).sort(function(a,b){return a-b}).map(function(d){return '<option value="'+d+'"'+(d===form.dur?' selected':'')+'>'+d+' Min.</option>'}).join('')+'</select></div><div class="field"><label for="bPrice">Preis</label><div class="price"><input id="bPrice" inputmode="numeric" autocomplete="off" value="'+form.price+'"><span>€</span></div></div></div><p class="hint" id="bPriceHint">'+priceHint()+'</p>';
 h+='<div class="field"><span class="lbl">Wunschfarbe</span><div class="colors">'+Object.keys(COLORS).map(function(k){return '<button type="button" class="cbtn" data-color="'+esc(k)+'" aria-pressed="'+(form.color===k)+'">'+sw(k)+esc(k)+'</button>'}).join('')+'</div></div>';
 h+='<div class="field"><label for="bNote">Notiz</label><textarea id="bNote" rows="2" placeholder="z. B. Mandelform, Glitzer am Ringfinger">'+esc(form.note)+'</textarea></div>';
 if(cf&&!hours(form.date))h+='<p class="msg">An diesem Tag ist das Studio normalerweise geschlossen.</p>';
 if(cf)h+='<p class="msg">Um diese Zeit ist schon '+esc(custName(cf))+' eingetragen ('+cf.start+'–'+fromMin(endOf(cf))+' Uhr). Nächste freie Zeit: '+firstFree(form.date,form.dur)+' Uhr.</p>';
 else if(!hours(form.date))h+='<p class="msg">An diesem Tag ist das Studio normalerweise geschlossen.</p>';
 h+='<p class="msg" id="bMsg" hidden></p><div class="pair"><button type="button" class="btn" data-close>Abbrechen</button><button type="button" class="btn primary" data-save>'+(cf?'Trotzdem speichern':'Speichern')+'</button></div>';
 if($('ov').hidden)openSheet(h);else $('sheet').innerHTML=h;
}
function saveBooking(){
 readBooking();var cid=form.customerId,newCust=null;
 if(!cid){var nm=form.newName.trim();if(!nm){var m=$('bMsg');m.textContent='Bitte eine Kundin wählen oder einen Namen eintragen.';m.hidden=false;var f=$('bNewName');if(f)f.focus();return}
  newCust={id:'c'+uid(),name:nm,phone:form.newPhone.trim(),color:form.color,note:''};state.customers.push(newCust);cid=newCust.id}
 var rec={date:form.date,start:form.start,dur:form.dur,serviceId:form.serviceId,customerId:cid,price:Number(form.price)||0,color:form.color,note:form.note.trim(),example:false};
 if(form.editId){var b=state.bookings.find(function(x){return x.id===form.editId});if(b)Object.assign(b,rec)}
 else state.bookings.push(Object.assign({id:uid(),status:'booked'},rec));
 var c=cust(cid);if(c&&form.color&&!c.color)c.color=form.color;
 var fromReq=form.fromRequest;
 if(fromReq)state.requests=state.requests.filter(function(r){return r.id!==fromReq});
 persist();var savedDate=form.date,savedStart=form.start,svcName=svc(form.serviceId).name;closeSheet();ui.calDate=savedDate;ui.month=null;render();
 if(fromReq&&c){var wa=waLink(c.phone,'Hallo '+c.name.split(' ')[0]+', dein Termin ist bestätigt: '+svcName+' am '+longDate(savedDate)+' um '+savedStart+' Uhr. Bis dann! '+OWNER+' vom '+STUDIO);
  openSheet('<div class="sh"><div><h3>Angenommen</h3><p>'+esc(c.name)+' · '+esc(longDate(savedDate))+' · '+savedStart+' Uhr</p></div>'+X+'</div>'+(wa?'<p class="small">Schicken Sie der Kundin jetzt die Bestätigung. Der Text ist schon fertig.</p><a class="btn wa" href="'+esc(wa)+'" target="_blank" rel="noopener">Bestätigung per WhatsApp senden</a>':'<p class="small">Für diese Kundin ist keine Nummer hinterlegt.</p>')+'<button type="button" class="btn" data-close>Fertig</button>')}
 else toast('Termin gespeichert');
}

function openDetail(id){
 var b=state.bookings.find(function(x){return x.id===id});if(!b)return;var s=svc(b.serviceId),c=cust(b.customerId);
 var lab={booked:'Gebucht',done:'Erledigt',noshow:'Nicht erschienen',cancelled:'Abgesagt'};
 var wa=c?waLink(c.phone,'Hallo '+c.name.split(' ')[0]+', kleine Erinnerung an deinen Termin ('+s.name+') am '+longDate(b.date)+' um '+b.start+' Uhr. Bis dann! '+OWNER):'';
 var h='<div class="sh"><div><h3>'+esc(c?c.name:'Kundin')+'</h3><p>'+esc(longDate(b.date))+' · '+b.start+'–'+fromMin(endOf(b))+' Uhr</p></div>'+X+'</div>';
 h+='<dl class="facts"><div><dt>Leistung</dt><dd>'+esc(s.name)+'</dd></div><div><dt>Preis</dt><dd>'+eur(b.price)+'</dd></div><div><dt>Wunschfarbe</dt><dd>'+(b.color?sw(b.color)+esc(b.color):'—')+'</dd></div><div><dt>Status</dt><dd>'+lab[b.status]+'</dd></div>'+(b.note?'<div><dt>Notiz</dt><dd>'+esc(b.note)+'</dd></div>':'')+(c&&c.note?'<div><dt>Zur Kundin</dt><dd>'+esc(c.note)+'</dd></div>':'')+'</dl>';
 h+='<div class="wrapbtns">'+['done','noshow','cancelled','booked'].filter(function(x){return x!==b.status}).map(function(x){return '<button type="button" class="btn" data-status="'+x+'">'+({done:'Erledigt',noshow:'Nicht erschienen',cancelled:'Abgesagt',booked:'Wieder offen'})[x]+'</button>'}).join('')+'</div>';
 if(wa)h+='<a class="btn wa" href="'+esc(wa)+'" target="_blank" rel="noopener">Erinnerung per WhatsApp</a>';
 h+='<div class="pair"><button type="button" class="btn" data-del="1">Löschen</button><button type="button" class="btn primary" data-edit="1">Ändern</button></div>';
 if(c)h+='<button type="button" class="btn ghost" data-open-cust="'+c.id+'">Kundinnenkarte öffnen ›</button>';
 openSheet(h);$('sheet').dataset.bid=b.id;
}

function openCustomer(id){
 var c=id?cust(id):{id:'',name:'',phone:'',color:'',note:''};if(!c)return;
 var hist=id?state.bookings.filter(function(b){return b.customerId===id}).sort(function(a,b){return a.date<b.date?1:-1}):[];
 var h='<div class="sh"><div><h3>'+(id?esc(c.name):'Neue Kundin')+'</h3><p>'+(id?visits(id).length+' Besuche':'Kundinnenkarte anlegen')+'</p></div>'+X+'</div>';
 h+='<div class="two"><div class="field"><label for="cName">Name</label><input id="cName" autocomplete="off" value="'+esc(c.name)+'"></div><div class="field"><label for="cPhone">WhatsApp</label><input id="cPhone" inputmode="tel" autocomplete="off" value="'+esc(c.phone)+'" placeholder="0151 …"></div></div>';
 h+='<div class="field"><span class="lbl">Lieblingsfarbe</span><div class="colors">'+Object.keys(COLORS).map(function(k){return '<button type="button" class="cbtn" data-ccolor="'+esc(k)+'" aria-pressed="'+(c.color===k)+'">'+sw(k)+esc(k)+'</button>'}).join('')+'</div></div>';
 h+='<div class="field"><label for="cNote">Notiz</label><textarea id="cNote" rows="2" placeholder="z. B. Nagelform, Allergien, Reha-Gast bis …">'+esc(c.note)+'</textarea></div>';
 h+='<p class="msg" id="cMsg" hidden></p><div class="pair"><button type="button" class="btn" data-close>Abbrechen</button><button type="button" class="btn primary" data-save-cust>Speichern</button></div>';
 if(id){var wa=waLink(c.phone,'Hallo '+c.name.split(' ')[0]+', ');h+='<div class="pair">'+(wa?'<a class="btn wa" href="'+esc(wa)+'" target="_blank" rel="noopener">WhatsApp</a>':'')+'<button type="button" class="btn" data-book-cust="'+c.id+'">Neuer Termin</button></div>';
  h+='<span class="lbl">Verlauf</span>'+(hist.length?'<ul class="hist">'+hist.map(function(b){return '<li><b>'+esc(shortDate(b.date))+'</b><span>'+esc(svc(b.serviceId).name)+(b.color?' · '+esc(b.color):'')+'</span><span>'+eur(b.price)+'</span></li>'}).join('')+'</ul>':'<p class="small">Noch keine Termine.</p>')}
 openSheet(h);$('sheet').dataset.cid=id||'new';$('sheet').dataset.ccolor=c.color||'';
}
function saveCustomer(){
 var name=$('cName').value.trim();if(!name){var m=$('cMsg');m.textContent='Bitte einen Namen eintragen.';m.hidden=false;$('cName').focus();return}
 var id=$('sheet').dataset.cid,data={name:name,phone:$('cPhone').value.trim(),color:$('sheet').dataset.ccolor||'',note:$('cNote').value.trim()};
 if(id==='new')state.customers.push(Object.assign({id:'c'+uid()},data));else{var c=cust(id);if(c)Object.assign(c,data)}
 persist();closeSheet();render();toast('Kundin gespeichert');
}

/* Events */
document.querySelector('.tabbar').addEventListener('click',function(e){var t=e.target.closest('[data-tab]');if(t){ui.tab=t.dataset.tab;render();window.scrollTo(0,0)}});
$('fab').addEventListener('click',function(){openBooking({date:ui.tab==='vKal'?ui.calDate:nextOpen(today())})});
document.querySelector('main').addEventListener('click',function(e){
 var t=e.target.closest('button,a');if(!t)return;
 if(t.dataset.bid){openDetail(t.dataset.bid);return}
 if(t.dataset.done){var b=state.bookings.find(function(x){return x.id===t.dataset.done});if(b){b.status='done';persist();render();toast('Als erledigt markiert')}return}
 if(t.dataset.accept){var r=state.requests.find(function(x){return x.id===t.dataset.accept});if(!r)return;var ex=state.customers.find(function(c){return c.name===r.name});openBooking({fromRequest:r.id,customerId:ex?ex.id:'',newName:r.name,newPhone:r.phone,serviceId:r.serviceId,date:r.date,start:r.start,note:r.note});return}
 if(t.dataset.decline){state.requests=state.requests.filter(function(x){return x.id!==t.dataset.decline});persist();render();toast('Anfrage abgelehnt');return}
 if(t.dataset.bookCust){openBooking({customerId:t.dataset.bookCust,serviceId:t.dataset.svc||'mani'});return}
 if(t.dataset.cal){ui.calDate=t.dataset.cal;ui.month=t.dataset.cal.slice(0,7);renderKal();return}
 if(t.dataset.month){var p=ui.month.split('-').map(Number),d=new Date(p[0],p[1]-1+Number(t.dataset.month),1);ui.month=d.getFullYear()+'-'+pad(d.getMonth()+1);renderKal();return}
 if(t.dataset.newOn){openBooking({date:t.dataset.newOn});return}
 if(t.dataset.cust){openCustomer(t.dataset.cust);return}
 if(t.dataset.act==='newcust'){openCustomer('');return}
 if(t.dataset.act==='reset'){state=seed();persist();ui.calDate=nextOpen(today());ui.month=null;render();toast('Beispieldaten zurückgesetzt')}
});
document.querySelector('main').addEventListener('input',function(e){if(e.target.id==='q'){ui.q=e.target.value;var pos=e.target.selectionStart;renderKund();var q=$('q');q.focus();try{q.setSelectionRange(pos,pos)}catch(err){}}});
$('ov').addEventListener('click',function(e){if(e.target===$('ov'))closeSheet()});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!$('ov').hidden)closeSheet()});
$('sheet').addEventListener('click',function(e){
 var t=e.target.closest('button,a');if(!t)return;
 if(t.hasAttribute('data-close')){closeSheet();return}
 if(form){
  if(t.dataset.color){readBooking();form.color=form.color===t.dataset.color?'':t.dataset.color;renderBooking();return}
  if(t.hasAttribute('data-save')){saveBooking();return}
  return;
 }
 if(t.dataset.ccolor){var cur=$('sheet').dataset.ccolor===t.dataset.ccolor?'':t.dataset.ccolor;$('sheet').dataset.ccolor=cur;$('sheet').querySelectorAll('[data-ccolor]').forEach(function(x){x.setAttribute('aria-pressed',String(x.dataset.ccolor===cur))});return}
 if(t.hasAttribute('data-save-cust')){saveCustomer();return}
 if(t.dataset.bookCust){var cid=t.dataset.bookCust;closeSheet();openBooking({customerId:cid});return}
 if(t.dataset.openCust){var oc=t.dataset.openCust;closeSheet();openCustomer(oc);return}
 var b=state.bookings.find(function(x){return x.id===$('sheet').dataset.bid});if(!b)return;
 if(t.dataset.status){b.status=t.dataset.status;persist();closeSheet();render();toast('Gespeichert');return}
 if(t.dataset.edit){var bb=b;closeSheet();openBooking({editId:bb.id,customerId:bb.customerId,serviceId:bb.serviceId,date:bb.date,start:bb.start,dur:bb.dur,price:bb.price,priceEdited:true,color:bb.color,note:bb.note});return}
 if(t.dataset.del){if(t.dataset.sure){state.bookings=state.bookings.filter(function(x){return x.id!==b.id});persist();closeSheet();render();toast('Termin gelöscht')}else{t.dataset.sure='1';t.textContent='Wirklich löschen?';t.style.color='var(--bad)'}}
});
$('sheet').addEventListener('change',function(e){
 if(!form)return;var id=e.target.id;
 if(id==='bCust'){readBooking();var c=cust(form.customerId);if(c&&c.color)form.color=c.color;renderBooking()}
 else if(id==='bSvc'){readBooking();form.dur=svc(form.serviceId).dur;form.priceEdited=false;renderBooking()}
 else if(id==='bDur'){readBooking();form.priceEdited=false;renderBooking()}
 else if(id==='bDate'||id==='bTime'){readBooking();renderBooking()}
});
$('sheet').addEventListener('input',function(e){if(form&&e.target.id==='bPrice'){form.price=Number(e.target.value.replace(/[^0-9]/g,''))||0;form.priceEdited=true;$('bPriceHint').textContent=priceHint()}});
render();
})();
</script>
</body>
</html>
